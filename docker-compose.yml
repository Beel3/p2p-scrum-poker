# Внутренний сервис Scrum Poker. Состояние комнат живёт в памяти процесса:
# перезапуск контейнера стирает комнаты — это осознанное ограничение MVP (ТЗ, раздел 2.3).
services:
  scrum-poker:
    build:
      context: .
      target: runtime
    image: scrum-poker:latest
    container_name: scrum-poker
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      LOG_LEVEL: info
      # "1", если перед контейнером стоит nginx/traefik (корректный req.ip для rate limit).
      TRUST_PROXY: '0'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
